[tasks."test"]
description = "Run tests (requires Xcode, not just CommandLineTools)"
run = """
echo "Tests use Swift Testing framework which requires Xcode."
echo "Run with: xcodebuild test -scheme Nehir"
echo "Or open in Xcode and run tests from there."
swift test
"""

[tasks."test:compile"]
description = "Check that tests compile (build test target)"
run = "swift build --build-tests"
